# 카프카 프로필 소비자(#666)를 로컬에서 시험할 단일 브로커. 운영·개발 브로커가 아니다.
#
#   docker compose -f compose.kafka.yml up -d
#   KAFKA_TEST_BOOTSTRAP_SERVERS=localhost:19092 uv run pytest tests/test_profile_kafka_e2e.py
#   docker compose -f compose.kafka.yml down
#
# 서버를 이 브로커에 붙여 보려면 .env 에 PROFILE_KAFKA_ENABLED=true, KAFKA_BOOTSTRAP_SERVERS=localhost:19092,
# PROFILE_KAFKA_GROUP_ID=book-ai-profile-v1-local 을 넣고, 토픽(book.ai-profile.v1, book.ai-profile.v1.DLT)을 먼저 만든다.
# BE 저장소의 compose.kafka.yml(9092)과 같이 띄워도 겹치지 않게 19092 를 쓴다.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: bookjeok-ai-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
