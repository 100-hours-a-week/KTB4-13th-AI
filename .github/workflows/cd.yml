name: CD

on:
  workflow_run:
    workflows:
      - Publish Docker image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR에 게시된 Git 커밋 SHA 태그
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AI server
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CD_ROLE_ARN: ${{ vars.AWS_CD_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      AI_EC2_INSTANCE_ID: ${{ vars.AI_EC2_INSTANCE_ID }}
      AI_DEPLOY_DIR: ${{ vars.AI_DEPLOY_DIR }}
      AI_COMPOSE_FILE: ${{ vars.AI_COMPOSE_FILE || 'compose.ai.yml' }}
      AI_SERVICE_NAME: ${{ vars.AI_SERVICE_NAME || 'ai-server' }}
      AI_HEALTHCHECK_URL: ${{ vars.AI_HEALTHCHECK_URL || 'http://127.0.0.1:8000/health' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release
        id: release
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISHED_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            image_tag="$MANUAL_IMAGE_TAG"
          else
            image_tag="$PUBLISHED_IMAGE_TAG"
          fi

          if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag는 40자의 Git 커밋 SHA여야 합니다."
            exit 1
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=${image_tag:0:7}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        run: |
          required=(
            AWS_REGION
            AWS_CD_ROLE_ARN
            ECR_REPOSITORY
            AI_EC2_INSTANCE_ID
            AI_DEPLOY_DIR
            AI_COMPOSE_FILE
            AI_SERVICE_NAME
            AI_HEALTHCHECK_URL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Variable $name 값이 없습니다."
              exit 1
            fi
          done

          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$AI_EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$AI_DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$AI_COMPOSE_FILE" =~ ^[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "$AI_COMPOSE_FILE" != *".."* ]]
          [[ "$AI_SERVICE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$AI_HEALTHCHECK_URL" =~ ^http://(127\.0\.0\.1|localhost)(:[0-9]+)?/[A-Za-z0-9._/-]*$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECR image
        id: image
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          image_digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR Image Digest를 확인할 수 없습니다."
            exit 1
          fi

          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          ecr_registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_uri="$ecr_registry/$ECR_REPOSITORY@$IMAGE_DIGEST"
          encoded_script=$(base64 --wrap=0 scripts/deploy_ai.sh)
          encoded_compose=$(base64 --wrap=0 compose.ai.yml)

          remote_command="remote_dir=\$(mktemp -d /tmp/bookjeok-ai-deploy.XXXXXX) || exit 1; printf '%s' '$encoded_script' | base64 -d > \"\$remote_dir/deploy.sh\" && printf '%s' '$encoded_compose' | base64 -d > \"\$remote_dir/compose.ai.yml\" && chmod 700 \"\$remote_dir/deploy.sh\" && \"\$remote_dir/deploy.sh\" '$AI_DEPLOY_DIR' '$AI_COMPOSE_FILE' '$AI_SERVICE_NAME' '$image_uri' '$RELEASE_SHA' '$AWS_REGION' '$ecr_registry' '$AI_HEALTHCHECK_URL' \"\$remote_dir/compose.ai.yml\"; status=\$?; rm -rf \"\$remote_dir\"; exit \$status"
          parameters=$(jq -cn \
            --arg command "$remote_command" \
            '{commands: [$command], executionTimeout: ["900"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$AI_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy AI $RELEASE_SHA" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          deadline=$((SECONDS + 900))
          deployment_status=Pending
          invocation=

          while [ "$SECONDS" -lt "$deadline" ]; do
            if invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$AI_EC2_INSTANCE_ID" 2>/tmp/ssm-invocation-error); then
              deployment_status=$(jq -r '.Status' <<< "$invocation")
              case "$deployment_status" in
                Success|Cancelled|TimedOut|Failed|Cancelling)
                  break
                  ;;
                Pending|InProgress|Delayed)
                  sleep 5
                  ;;
                *)
                  echo "::error::알 수 없는 SSM 상태입니다: $deployment_status"
                  exit 1
                  ;;
              esac
            elif grep -q InvocationDoesNotExist /tmp/ssm-invocation-error; then
              sleep 2
            else
              cat /tmp/ssm-invocation-error >&2
              exit 1
            fi
          done

          if [ -n "$invocation" ]; then
            jq -r '.StandardOutputContent' <<< "$invocation"
            jq -r '.StandardErrorContent' <<< "$invocation" >&2
          fi

          if [ "$deployment_status" != "Success" ]; then
            echo "::error::SSM 배포가 실패했습니다. status=$deployment_status"
            exit 1
          fi
