name: OIDC Debug

on:
  push:
    branches:
      - ci/docker-ecr-workflow

permissions:
  contents: read
  id-token: write

jobs:
  oidc-debug:
    name: Inspect and verify AWS OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show OIDC claims
        shell: bash
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"

          ID_TOKEN="$(jq -r '.value' <<< "${TOKEN_JSON}")"

          ID_TOKEN="${ID_TOKEN}" node -e '
            const [headerPart, payloadPart] = process.env.ID_TOKEN.split(".");
            const header = JSON.parse(Buffer.from(headerPart, "base64url").toString());
            const claims = JSON.parse(Buffer.from(payloadPart, "base64url").toString());

            console.log(JSON.stringify({
              alg: header.alg,
              kid: header.kid,
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              iat: claims.iat,
              nbf: claims.nbf,
              exp: claims.exp,
              repository: claims.repository,
              repository_id: claims.repository_id,
              repository_owner_id: claims.repository_owner_id
            }, null, 2));
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
