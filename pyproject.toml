[project]
name = "bookjeok-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "openai>=3.15.0",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
extend-exclude = ["docs", ".agents"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 Depends()/Query() 등은 기본값 자리에서 호출하는 게 정석 패턴이라
# B008(가변 기본값 경고) 대상에서 뺀다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
# 테스트에서 app 패키지를 import 하려면 저장소 루트가 import 경로에 있어야 한다
pythonpath = ["."]
